<!DOCTYPE html>
<html>
  <head>
    <title>Duck Scanner</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
    >
      <a-marker id="duckMarker" type="pattern" patternUrl="HCI-Coursework\pattern-Mallard © Mark Hamblin.patt">
      <a-entity look-at="#camera">
        <a-plane 
          width="5.5" 
          height="1.5" 
          color="#000000" 
          opacity="0.8"
          position="0 0.5 -0.01">
        </a-plane>
        <a-entity
          id="duckFactText"
          text="value: Mallard Duck; 
                color: #FFFFFF; 
                width: 10; 
                align: center; 
                font: mozillavr; 
                letterSpacing: 2;"
          position="0 0.5 0"
          rotation="0 0 0"
        ></a-entity>
      </a-entity>
    </a-marker>
      <a-entity id="camera" camera></a-entity>
    </a-scene>

    <script>
      window.setDuckFact = function(newText) {
        const textEl = document.querySelector('#duckFactText');
        textEl.setAttribute('text', 'value', newText);
        console.log("Fact updated to:", newText);
      };

      const marker = document.querySelector('#duckMarker');
      marker.addEventListener('markerFound', () => {
        console.log('Duck marker detected!');
      });
    </script>
  </body>
</html>
